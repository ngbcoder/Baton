name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: cd protocol && dart pub get && dart analyze && dart test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-test-results
          path: protocol/test/

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: cd desktop && go vet ./... && go test ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build
          path: desktop/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: cd android && flutter pub get && flutter analyze && flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: android/build/app/outputs/flutter-apk/